<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nichescope</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#14120f; --panel:#1e1b17; --panel2:#242019; --ink:#f1ece3; --muted:#a89e91;
    --line:#332d25; --accent:#8b5cf6; --accent-hover:#7c3aed; --accent2:#22d3ee;
    --accent-glow: rgba(139,92,246,.16);
    --badge-active-bg:#1d3540; --badge-active-fg:#a9d4e3;
    --badge-unresolved-bg:#2c281f; --badge-unresolved-fg:#a89e91;
    --badge-caution-bg:#3a2a17; --badge-caution-fg:#e3b57f;
    --sat-low-bg:#22331d; --sat-low-fg:#a6d69a;
    --sat-med-bg:#372f18; --sat-med-fg:#e0c47c;
    --sat-high-bg:#3a221d; --sat-high-fg:#e79c8c;
    --sat-unknown-bg:#2c281f; --sat-unknown-fg:#a89e91;
    --ok-bg:#1d3a24; --ok-fg:#8fd6a0;
    --err-bg:#3a1d1d; --err-fg:#e79c8c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.45), 0 12px 28px rgba(139,92,246,.14);
    --star: #e0c47c;
  }
  *{box-sizing:border-box}
  html,body{ overflow-x:hidden; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.4; padding-bottom:84px;
  }
  a{ color:var(--accent2); }
  header{ max-width:1180px; margin:0 auto; padding:24px 16px 4px; }
  header h1{
    font-size:2rem; margin:0; letter-spacing:-.02em; font-weight:800;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .subtitle{ font-size:.8rem; color:var(--muted); font-weight:600; letter-spacing:.02em; margin:2px 0 6px; }
  header .meta{ color:var(--muted); font-size:.82rem; }

  nav.tabs{
    max-width:1180px; margin:16px auto 0; padding:0 16px;
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; background:var(--panel); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font-size:.85rem; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  main{ max-width:1180px; margin:0 auto; padding:20px 16px 40px; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .filter-group{ display:flex; flex-wrap:wrap; gap:6px; }
  .filter-label{ font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-right:2px; align-self:center; }
  .chip{
    background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-size:.75rem; cursor:pointer; font-weight:600;
  }
  .chip.active{ background:var(--sat-med-bg); color:var(--ink); border-color:var(--accent); }
  .clear-link{ background:none; border:none; color:var(--muted); font-size:.75rem; text-decoration:underline; cursor:pointer; padding:5px 4px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{
    transform:translateY(-3px); box-shadow:var(--shadow-lift); border-color:#4c3d80;
  }
  .thumb{ height:110px; position:relative; }
  .thumb.photo{ overflow:hidden; }
  .thumb.photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb.nodata{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:repeating-linear-gradient(135deg, var(--line), var(--line) 6px, transparent 6px, transparent 12px);
    color:var(--muted); font-size:.62rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  }
  .thumb.nodata .nodata-icon{ font-size:1.2rem; }
  a.thumb-link{ display:block; }
  .card-body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:9px; flex:1; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .card-title{ font-size:.92rem; font-weight:600; margin:0; }
  .fav-btn{
    background:none; border:none; font-size:1.15rem; line-height:1; cursor:pointer; color:var(--muted);
    padding:0 2px; flex:0 0 auto;
  }
  .fav-btn.active{ color:var(--star); }
  .card-cat{ font-size:.72rem; color:var(--muted); }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; margin-top:1px; }
  .badge{
    font-size:.64rem; font-weight:600; padding:3px 8px; border-radius:999px;
    letter-spacing:.02em; text-transform:uppercase; white-space:nowrap;
  }
  .badge.status-active{ background:var(--badge-active-bg); color:var(--badge-active-fg); }
  .badge.status-unresolved{ background:var(--badge-unresolved-bg); color:var(--badge-unresolved-fg); }
  .badge.status-caution{ background:var(--badge-caution-bg); color:var(--badge-caution-fg); }
  .badge.sat-low{ background:var(--sat-low-bg); color:var(--sat-low-fg); }
  .badge.sat-medium{ background:var(--sat-med-bg); color:var(--sat-med-fg); }
  .badge.sat-high{ background:var(--sat-high-bg); color:var(--sat-high-fg); }
  .badge.sat-unknown{ background:var(--sat-unknown-bg); color:var(--sat-unknown-fg); }
  .badge.agent-success{ background:var(--ok-bg); color:var(--ok-fg); }
  .badge.agent-error, .badge.agent-fail, .badge.agent-failed{ background:var(--err-bg); color:var(--err-fg); }
  .row{ display:flex; justify-content:space-between; gap:8px; font-size:.74rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:7px; margin-top:1px; }
  .row b{ color:var(--ink); font-weight:600; text-align:right; }
  .example{ font-size:.74rem; color:var(--muted); font-style:italic; }
  .example b{ font-style:normal; color:var(--ink); }
  .na{ opacity:.6; }

  h3{ font-size:.95rem; margin:20px 0 10px; }
  .status-grid{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
    box-shadow:var(--shadow); min-width:150px; flex:1 1 150px;
  }
  .stat-label{ display:block; font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .stat-val{ display:block; font-size:1.1rem; font-weight:700; margin-top:2px; }
  .agent-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .ceo-summary{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:.85rem; color:var(--muted); }
  .ceo-summary p{ margin:0 0 10px; }
  .ceo-summary ul{ margin:0 0 10px; padding-left:20px; }
  .ceo-summary li{ margin-bottom:6px; }
  .ceo-summary b{ color:var(--ink); }
  .ceo-summary code{ background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:.85em; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  table{ border-collapse:collapse; width:100%; font-size:.78rem; }
  th,td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--muted); font-weight:600; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; }
  th .muted{ display:block; font-weight:400; text-transform:none; letter-spacing:0; font-size:.7rem; margin-top:2px; }
  tbody tr:last-child td{ border-bottom:none; }

  .fab-row{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:14px; pointer-events:none; }
  #export-btn{
    pointer-events:auto; background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:12px 22px; font-size:.85rem; font-weight:700; cursor:pointer; box-shadow:var(--shadow-lift);
    transition:background .15s;
  }
  #export-btn:hover{ background:var(--accent-hover); }
  #toast{
    position:fixed; left:50%; bottom:70px; transform:translate(-50%,10px); background:var(--panel2);
    color:var(--ink); border:1px solid var(--line); padding:10px 16px; border-radius:10px;
    font-size:.8rem; box-shadow:var(--shadow); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width: 480px){
    .grid{ grid-template-columns:1fr; }
    .status-grid{ flex-direction:column; }
  }

  .graph-hint{ font-size:.72rem; color:var(--muted); margin-bottom:10px; }
  #graph-wrap{
    position:relative; width:100%; height:560px; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    background: radial-gradient(ellipse at 50% 38%, #101c33 0%, #060a14 65%, #030509 100%);
  }
  #graph-svg{ width:100%; height:100%; display:block; cursor:grab; }
  #graph-svg:active{ cursor:grabbing; }
  .graph-node{ cursor:pointer; }
  .node-label{
    fill:#c9d6ea; font-size:9px; font-weight:600; pointer-events:none;
    paint-order:stroke; stroke:#060a14; stroke-width:3px; stroke-linejoin:round;
  }
  .graph-link{ stroke:#9cc4ff; }
  #graph-tooltip{
    position:absolute; max-width:240px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:.72rem; color:var(--muted); pointer-events:none;
    opacity:0; transition:opacity .12s; box-shadow:var(--shadow); z-index:5;
  }
  #graph-tooltip.show{ opacity:1; }
  .gt-title{ font-size:.8rem; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .gt-row{ display:flex; justify-content:space-between; gap:8px; margin-top:2px; }
  .gt-row b{ color:var(--ink); text-align:right; }
  .gt-example{ margin-top:6px; font-style:italic; }
  .graph-legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-size:.72rem; color:var(--muted); }
  .graph-legend .swatch{
    display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle;
  }
  .graph-legend .swatch.gap-swatch{ background:transparent; border:1.5px solid #fff8; }

  @media (max-width: 480px){
    #graph-wrap{ height:420px; }
  }
</style>
</head>
<body>

<header>
  <h1>Nichescope</h1>
  <div class="subtitle">Etsy POD Research &amp; Earnings Dashboard</div>
  <div class="meta" id="meta-line"></div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="niches">Live Niches</button>
  <button class="tab" data-tab="briefs">Design Briefs</button>
  <button class="tab" data-tab="history">History</button>
  <button class="tab" data-tab="status">Pipeline Status</button>
  <button class="tab" data-tab="graph">Node Map</button>
</nav>

<main>
  <section id="panel-niches" class="panel active">
    <div class="filters">
      <span class="filter-label">Type</span>
      <div class="filter-group" id="filter-type"></div>
      <span class="filter-label">Saturation</span>
      <div class="filter-group" id="filter-sat">
        <button class="chip" data-sat="low">Low</button>
        <button class="chip" data-sat="medium">Medium</button>
        <button class="chip" data-sat="high">High</button>
      </div>
      <button class="clear-link" id="clear-filters">Clear filters</button>
    </div>
    <div class="grid" id="niche-grid"></div>
  </section>

  <section id="panel-briefs" class="panel">
    <div class="grid" id="gap-grid"></div>
  </section>

  <section id="panel-history" class="panel">
    <div id="history-body"></div>
  </section>

  <section id="panel-status" class="panel">
    <div id="status-body"></div>
  </section>

  <section id="panel-graph" class="panel">
    <div class="graph-hint">Drag nodes to rearrange · scroll/pinch to zoom · hover for details · click a niche node to open its Etsy listing</div>
    <div id="graph-wrap">
      <svg id="graph-svg"></svg>
      <div id="graph-tooltip"></div>
    </div>
    <div class="graph-legend" id="graph-legend"></div>
  </section>
</main>

<div class="fab-row"><button id="export-btn">⭐ Export favorites.md</button></div>
<div id="toast"></div>

<script>/*__D3_BUNDLE__*/</script>
<script>
const DATA = /*__DATA_JSON__*/null;
const FAV_KEY = 'etsypod_favorites_v1';

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mdInline(s){
  let t = escapeHtml(s);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return t;
}
function mdBlock(s){
  const lines = (s || '').split('\n').map(l => l.trim()).filter(l => l.length);
  let out = '', inList = false;
  for (const line of lines) {
    if (line.startsWith('- ')) {
      if (!inList) { out += '<ul>'; inList = true; }
      out += `<li>${mdInline(line.slice(2))}</li>`;
    } else {
      if (inList) { out += '</ul>'; inList = false; }
      out += `<p>${mdInline(line)}</p>`;
    }
  }
  if (inList) out += '</ul>';
  return out;
}

function loadFavorites(){
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '{}'); }
  catch (e) { console.warn('favorites: localStorage read failed', e); return {}; }
}
function saveFavorites(obj){
  try { localStorage.setItem(FAV_KEY, JSON.stringify(obj)); }
  catch (e) { console.warn('favorites: localStorage write failed', e); }
}
let favorites = loadFavorites();
function isFavorited(id){ return !!favorites[id]; }
function toggleFavorite(id, snapshot){
  if (favorites[id]) delete favorites[id];
  else favorites[id] = { ...snapshot, flaggedAt: new Date().toISOString() };
  saveFavorites(favorites);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 2500);
}

function nicheCardHTML(n){
  const id = 'niche:' + n.name;
  const fav = isFavorited(id);
  const thumb = n.img
    ? `<a class="thumb-link" href="${n.url || '#'}" target="_blank" rel="noopener"><div class="thumb photo"><img src="${n.img}" alt="${escapeHtml(n.name)}" loading="lazy"></div></a>`
    : `<div class="thumb nodata"><span class="nodata-icon">🚫</span>NO DATA AVAILABLE</div>`;
  return `
    <div class="card">
      ${thumb}
      <div class="card-body">
        <div class="card-top">
          <p class="card-title">${escapeHtml(n.name)}</p>
          <button class="fav-btn ${fav ? 'active' : ''}" data-id="${escapeHtml(id)}" data-type="niche"
            data-title="${escapeHtml(n.name)}" data-url="${escapeHtml(n.url || '')}" data-price="${escapeHtml(n.price || '')}"
            title="Flag as favorite">${fav ? '★' : '☆'}</button>
        </div>
        <div class="card-cat">${escapeHtml(n.category.join(' · '))}</div>
        <div class="badges">
          <span class="badge status-${escapeHtml(n.status)}">${escapeHtml(n.status)}</span>
          <span class="badge sat-${escapeHtml(n.satLevel)}">${escapeHtml(n.satLevel)} saturation${n.count != null ? ` (${n.count.toLocaleString()})` : ''}</span>
        </div>
        ${n.title ? `<div class="example">Example: <b>${escapeHtml(n.title)}</b></div>` : '<div class="example na">No confirmed example listing</div>'}
        <div class="row"><span>Price</span><b>${n.price ? escapeHtml(n.price) : '<span class="na">not captured</span>'}</b></div>
        <div class="row"><span>Reviews</span><b>${n.reviews != null ? n.reviews : '<span class="na">not captured</span>'}</b></div>
        <div class="row"><span>Listed</span><b>${n.listed ? escapeHtml(n.listed) : '<span class="na">not captured</span>'}</b></div>
        ${n.statusNote ? `<div class="row"><span>Note</span><b>${escapeHtml(n.statusNote)}</b></div>` : ''}
        ${n.note ? `<div class="row"><span>Note</span><b>${escapeHtml(n.note)}</b></div>` : ''}
      </div>
    </div>`;
}

function gapCardHTML(g){
  const id = 'gap:' + g.rank + ':' + g.name;
  const fav = isFavorited(id);
  const b = g.brief;
  return `
    <div class="card">
      <div class="thumb nodata"><span class="nodata-icon">🚫</span>NO DATA AVAILABLE</div>
      <div class="card-body">
        <div class="card-top">
          <p class="card-title">#${g.rankLabel} · ${escapeHtml(g.name)}</p>
          <button class="fav-btn ${fav ? 'active' : ''}" data-id="${escapeHtml(id)}" data-type="gap"
            data-title="${escapeHtml(g.name)}" data-url="" data-price="${escapeHtml(b && b.price || '')}"
            title="Flag as favorite">${fav ? '★' : '☆'}</button>
        </div>
        ${b ? `
          <div class="card-cat">${escapeHtml(b.productType || '')}</div>
          ${b.exactText ? `<div class="example">${mdInline(b.exactText)}</div>` : ''}
          <div class="row"><span>Suggested price</span><b>${escapeHtml(b.price || '—')}</b></div>
          ${b.audience ? `<div class="row"><span>Audience</span><b>${escapeHtml(b.audience)}</b></div>` : ''}
          ${b.style ? `<div class="example"><i>Style:</i> ${escapeHtml(b.style)}</div>` : ''}
        ` : `<div class="example na">No design brief written for this gap yet.</div>`}
        <div class="example">Verification: ${mdInline(g.verification)}</div>
        ${g.risk ? `<div class="example"><i>Risk:</i> ${escapeHtml(g.risk)}</div>` : ''}
      </div>
    </div>`;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.fav-btn');
  if (btn) {
    const id = btn.dataset.id;
    const snapshot = { type: btn.dataset.type, title: btn.dataset.title, url: btn.dataset.url || null, price: btn.dataset.price || null };
    toggleFavorite(id, snapshot);
    const nowFav = btn.classList.toggle('active');
    btn.textContent = nowFav ? '★' : '☆';
    return;
  }
  const typeChip = e.target.closest('.chip[data-type]');
  if (typeChip) {
    const t = typeChip.dataset.type;
    if (activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
    typeChip.classList.toggle('active');
    renderNiches();
    return;
  }
  const satChip = e.target.closest('.chip[data-sat]');
  if (satChip) {
    const s = satChip.dataset.sat;
    if (activeSats.has(s)) activeSats.delete(s); else activeSats.add(s);
    satChip.classList.toggle('active');
    renderNiches();
    return;
  }
  if (e.target.id === 'clear-filters') {
    activeTypes.clear(); activeSats.clear();
    document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
    renderNiches();
    return;
  }
  const tab = e.target.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'graph' && !graphInitialized) {
      graphInitialized = true;
      initGraph();
    }
  }
});

let graphInitialized = false;

function renderGraphLegend(){
  const el = document.getElementById('graph-legend');
  const items = Object.entries(DATA.categoryColors || {})
    .map(([cat, color]) => `<span><span class="swatch" style="background:${color}"></span>${escapeHtml(cat)}</span>`);
  items.push('<span><span class="swatch gap-swatch"></span>design gap (larger = bigger opportunity)</span>');
  el.innerHTML = items.join('');
}

function initGraph(){
  const wrap = document.getElementById('graph-wrap');
  const tooltip = document.getElementById('graph-tooltip');
  const gdata = DATA.graph;
  if (!gdata || !gdata.nodes || !gdata.nodes.length) {
    wrap.innerHTML = '<p class="na" style="padding:20px">No graph data available.</p>';
    return;
  }

  const w = wrap.clientWidth || 800;
  const h = wrap.clientHeight || 560;
  const svg = d3.select('#graph-svg').attr('viewBox', `0 0 ${w} ${h}`).attr('preserveAspectRatio', 'xMidYMid meet');

  const defs = svg.append('defs');
  const filter = defs.append('filter').attr('id', 'node-glow')
    .attr('x', '-150%').attr('y', '-150%').attr('width', '400%').attr('height', '400%');
  filter.append('feGaussianBlur').attr('stdDeviation', 4).attr('result', 'blur');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'blur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');

  const starLayer = svg.append('g').attr('class', 'starfield');
  const stars = d3.range(80).map(() => ({
    x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.1 + 0.3, o: Math.random() * 0.4 + 0.12,
  }));
  starLayer.selectAll('circle').data(stars).join('circle')
    .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => d.r).attr('fill', '#cfe0ff').attr('opacity', d => d.o);

  const container = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', (event) => container.attr('transform', event.transform)));

  const nodes = gdata.nodes.map(d => Object.assign({}, d));
  const links = gdata.links.map(d => Object.assign({}, d));

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => 95 - d.weight * 12).strength(d => 0.15 + 0.1 * d.weight))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('center', d3.forceCenter(w / 2, h / 2))
    .force('x', d3.forceX(w / 2).strength(0.04))
    .force('y', d3.forceY(h / 2).strength(0.05))
    .force('collide', d3.forceCollide().radius(d => d.r + 10));

  const linkSel = container.append('g').selectAll('line')
    .data(links).join('line')
    .attr('class', 'graph-link')
    .attr('stroke-width', d => 1 + d.weight * 0.8)
    .attr('stroke-opacity', d => 0.16 + d.weight * 0.14);

  const nodeSel = container.append('g').selectAll('g')
    .data(nodes).join('g')
    .attr('class', d => 'graph-node ' + (d.kind === 'gap' ? 'is-gap' : 'is-niche'))
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event) => { if (!event.active) simulation.alphaTarget(0); }));

  nodeSel.append('circle').attr('class', 'node-halo')
    .attr('r', d => d.r * 1.7).attr('fill', d => d.color).attr('opacity', 0.3).attr('filter', 'url(#node-glow)');
  nodeSel.append('circle').attr('class', 'node-core')
    .attr('r', d => d.r).attr('fill', d => d.color)
    .attr('stroke', d => d.kind === 'gap' ? '#ffffffaa' : 'none').attr('stroke-width', d => d.kind === 'gap' ? 1.2 : 0);
  nodeSel.append('text').attr('class', 'node-label')
    .attr('dy', d => d.r + 13).attr('text-anchor', 'middle')
    .text(d => d.label.length > 24 ? d.label.slice(0, 22) + '…' : d.label);

  nodeSel.on('mouseenter', (event, d) => showGraphTooltip(event, d, wrap, tooltip))
    .on('mousemove', (event) => positionGraphTooltip(event, wrap, tooltip))
    .on('mouseleave', () => tooltip.classList.remove('show'))
    .on('click', (event, d) => { if (d.url) window.open(d.url, '_blank', 'noopener'); });

  simulation.on('tick', () => {
    nodes.forEach(d => {
      d.x = Math.max(d.r + 6, Math.min(w - d.r - 6, d.x));
      d.y = Math.max(d.r + 20, Math.min(h - d.r - 6, d.y));
    });
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function showGraphTooltip(event, d, wrap, tooltip){
  let h = `<div class="gt-title">${escapeHtml(d.name)}</div>`;
  h += `<div class="gt-row"><span>Type</span><b>${d.kind === 'gap' ? 'Design gap' : 'Niche'}</b></div>`;
  if (d.category) h += `<div class="gt-row"><span>Category</span><b>${escapeHtml(d.category)}</b></div>`;
  if (d.satLevel) h += `<div class="gt-row"><span>Saturation</span><b>${escapeHtml(d.satLevel)}${d.count != null ? ` (${d.count.toLocaleString()})` : ''}</b></div>`;
  if (d.example) h += `<div class="gt-example">${mdInline(d.example)}</div>`;
  if (d.price) h += `<div class="gt-row"><span>Price</span><b>${escapeHtml(d.price)}</b></div>`;
  tooltip.innerHTML = h;
  tooltip.classList.add('show');
  positionGraphTooltip(event, wrap, tooltip);
}
function positionGraphTooltip(event, wrap, tooltip){
  const rect = wrap.getBoundingClientRect();
  let x = event.clientX - rect.left + 16;
  let y = event.clientY - rect.top + 16;
  if (x > rect.width - 250) x = event.clientX - rect.left - 250;
  if (y > rect.height - 130) y = rect.height - 130;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

let activeTypes = new Set();
let activeSats = new Set();

function renderTypeFilters(){
  document.getElementById('filter-type').innerHTML = DATA.productTypes
    .map(t => `<button class="chip" data-type="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');
}

function renderNiches(){
  const grid = document.getElementById('niche-grid');
  const filtered = DATA.niches.filter(n => {
    const typeOk = activeTypes.size === 0 || n.category.some(c => activeTypes.has(c));
    const satOk = activeSats.size === 0 || activeSats.has(n.satLevel);
    return typeOk && satOk;
  });
  grid.innerHTML = filtered.length ? filtered.map(nicheCardHTML).join('') : '<p class="na">No niches match these filters.</p>';
}

function renderHistory(){
  const wrap = document.getElementById('history-body');
  if (!DATA.history.length) { wrap.innerHTML = '<p class="na">No cycle history yet.</p>'; return; }
  let h = '<div class="table-wrap"><table><thead><tr><th>Niche</th>';
  for (const c of DATA.history) h += `<th>Cycle ${c.cycle}<span class="muted">${c.date || ''}</span></th>`;
  h += '</tr></thead><tbody>';
  for (const name of DATA.historyNicheNames) {
    h += `<tr><td>${escapeHtml(name)}</td>`;
    for (const c of DATA.history) {
      const n = c.niches.find(x => x.name === name);
      h += n
        ? `<td><span class="badge status-${escapeHtml(n.status)}">${escapeHtml(n.status)}</span> <span class="badge sat-${escapeHtml(n.satLevel)}">${escapeHtml(n.satLevel)}</span></td>`
        : '<td class="na">—</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  if (DATA.history.length < 2) h += '<p class="na" style="margin-top:10px">Only one cycle recorded so far — trends will appear here as more cycles run.</p>';
  wrap.innerHTML = h;
}

function renderStatus(){
  const p = DATA.pipeline;
  let h = `<div class="status-grid">
    <div class="stat"><span class="stat-label">Last run</span><span class="stat-val">${escapeHtml(p.lastRun || 'unknown')}</span></div>
    <div class="stat"><span class="stat-label">Next scheduled</span><span class="stat-val">${escapeHtml(p.nextScheduled || 'not scheduled')}</span></div>
  </div>
  <h3>Agent status (last cycle)</h3>
  <div class="agent-row">`;
  if (p.agents.length) {
    for (const a of p.agents) {
      h += `<span class="badge agent-${escapeHtml(a.status)}">${escapeHtml(a.name)}: ${escapeHtml(a.status)}${a.detail ? ` (${escapeHtml(a.detail)})` : ''}</span>`;
    }
  } else {
    h += '<span class="na">No run log recorded for this cycle.</span>';
  }
  h += '</div>';
  if (p.summary) h += `<h3>What happened this cycle</h3><div class="ceo-summary">${mdBlock(p.summary)}</div>`;
  document.getElementById('status-body').innerHTML = h;
}

function buildFavoritesMarkdown(){
  const entries = Object.entries(favorites);
  let md = `# Favorites — flagged for design\n\nGenerated ${new Date().toISOString()} from the Etsy POD dashboard.\n\n`;
  if (!entries.length) { md += '_No favorites flagged yet._\n'; return md; }
  const niches = entries.filter(([, v]) => v.type === 'niche');
  const gaps = entries.filter(([, v]) => v.type === 'gap');
  if (niches.length) {
    md += '## Niches\n\n';
    for (const [, v] of niches) md += `- **${v.title}**${v.price ? ` — ${v.price}` : ''}${v.url ? ` — [listing](${v.url})` : ''} _(flagged ${(v.flaggedAt || '').slice(0, 10)})_\n`;
    md += '\n';
  }
  if (gaps.length) {
    md += '## Design brief gaps\n\n';
    for (const [, v] of gaps) md += `- **${v.title}**${v.price ? ` — ${v.price}` : ''} _(flagged ${(v.flaggedAt || '').slice(0, 10)})_\n`;
    md += '\n';
  }
  return md;
}

async function exportFavorites(){
  const md = buildFavoritesMarkdown();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'favorites.md',
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(md);
      await writable.close();
      toast('Saved favorites.md');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      console.warn('File System Access export failed, falling back to download', e);
    }
  }
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'favorites.md';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Downloaded favorites.md — move it into etsy-pod-agent/ to keep it with the project');
}

document.getElementById('meta-line').textContent =
  `Cycle ${DATA.cycle.number} — ${DATA.cycle.date || ''} · generated ${DATA.generatedAt.replace('T', ' ')}`;
renderTypeFilters();
renderNiches();
document.getElementById('gap-grid').innerHTML = DATA.gaps.slice().sort((a, b) => a.rank - b.rank).map(gapCardHTML).join('');
renderHistory();
renderStatus();
renderGraphLegend();
document.getElementById('export-btn').addEventListener('click', exportFavorites);
</script>
